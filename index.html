<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xnova HoloBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Un solo mundo visual oscuro (la línea Xnova): panel de cristal sobre azul noche, acento azul nova. */
  --bg: #090b13;
  --panel: rgba(20, 24, 38, 0.78);
  --line: rgba(255, 255, 255, 0.09);
  --ink: #eef1fa;
  --muted: #9aa3bd;
  --accent: #6294ff;
  --accent-hi: #8cb2ff;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(1100px 520px at 50% -180px, rgba(98, 148, 255, 0.22), transparent 70%),
    linear-gradient(180deg, #0e1222 0%, var(--bg) 60%);
  background-color: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 48px; display: grid; gap: 22px; }
header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo {
  width: 44px; height: 44px; border-radius: 11px; flex: none;
  background: linear-gradient(160deg, rgba(98,148,255,.35), rgba(98,148,255,.05));
  border: 1px solid rgba(140,178,255,.45);
  display: grid; place-items: center;
}
.logo svg { width: 26px; height: 26px; }
.brand h1 { margin: 0; font: 700 26px/1.1 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.brand h1 span { color: var(--accent-hi); }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.lang { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { background: transparent; color: var(--muted); border: 0; padding: 6px 12px; font: 600 12px var(--font-body); cursor: pointer; }
.lang button[aria-pressed="true"] { background: rgba(98,148,255,.22); color: var(--ink); }

.grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(10px); padding: 20px;
}
.panel h2 { margin: 0 0 4px; font: 700 15px/1.3 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-hi); display: flex; align-items: center; gap: 8px; }
.panel h2::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
.panel .sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }

.drop {
  position: relative; display: grid; place-items: center; text-align: center; gap: 6px;
  min-height: 190px; padding: 22px; border-radius: 12px; cursor: pointer;
  border: 1.5px dashed rgba(140,178,255,.45); background: rgba(98,148,255,.06);
  transition: background .15s, border-color .15s;
}
.drop:hover, .drop.over { background: rgba(98,148,255,.13); border-color: var(--accent-hi); }
.drop:focus-within { outline: 2px solid var(--accent-hi); outline-offset: 3px; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop .big { font: 700 18px var(--font-display); }
.drop .hint { color: var(--muted); font-size: 13px; }
.drop .ext { display: inline-flex; gap: 6px; margin-top: 4px; }
.chip { font: 500 11px var(--font-mono); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: rgba(255,255,255,.03); }

.log { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font: 13px/1.5 var(--font-mono); }
.log li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; color: var(--muted); }
.log li::before { content: "›"; color: var(--accent); }
.log li.ok { color: var(--ink); } .log li.ok::before { content: "✓"; color: var(--good); }
.log li.err { color: var(--bad); } .log li.err::before { content: "✕"; color: var(--bad); }

.result { margin-top: 16px; display: none; gap: 14px; }
.result.show { display: grid; }
.result .name { font: 700 16px var(--font-display); word-break: break-word; }
.subs { display: flex; flex-wrap: wrap; gap: 6px; }
.sp { font: 600 12px var(--font-body); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); }
.sp.x { border-color: rgba(140,178,255,.5); background: rgba(98,148,255,.14); color: var(--ink); }
.sp.v { color: var(--muted); }
.sp.def::after { content: " ★"; color: var(--warn); }
.btn {
  appearance: none; border: 1px solid rgba(140,178,255,.6); border-radius: 10px; cursor: pointer;
  background: linear-gradient(180deg, #6f9dff, #4a7ff0); color: #fff;
  font: 700 15px var(--font-body); padding: 12px 18px; width: 100%;
  box-shadow: 0 6px 22px rgba(74,127,240,.35);
}
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.note { font-size: 13px; color: var(--muted); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
.note b { color: var(--warn); }

.fix { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.fix li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
.fix .n { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 700 13px var(--font-mono); color: var(--accent-hi); background: rgba(98,148,255,.12); border: 1px solid rgba(140,178,255,.3); }
.fix strong { display: block; font-weight: 700; }
.fix span { color: var(--muted); font-size: 14px; }

.stack { display: grid; gap: 6px; margin-top: 4px; }
.stack .row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
.stack .row.hl { border-color: rgba(140,178,255,.55); background: rgba(98,148,255,.12); }
.stack .pos { font: 700 12px var(--font-mono); color: var(--muted); }
.stack .tag { font: 600 11px var(--font-body); color: var(--muted); }
.support { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .support { grid-template-columns: 1fr; } }
.card { display: grid; gap: 10px; align-content: start; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
.card h3 { margin: 0; font: 700 16px var(--font-display); }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.link-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font: 700 14px var(--font-body); padding: 10px 14px; border-radius: 10px; border: 1px solid transparent; }
.link-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.link-btn.cf { background: #f16436; color: #fff; }
.link-btn.cf:hover { filter: brightness(1.08); }
.link-btn.kofi { background: rgba(255,255,255,.06); color: var(--ink); border-color: rgba(255,255,255,.18); }
.link-btn.kofi:hover { background: rgba(255,255,255,.1); }
.row a { color: var(--accent-hi); text-decoration: none; }
.row a:hover { text-decoration: underline; }
.foot { color: var(--muted); font-size: 12.5px; text-align: center; }
.foot a { color: var(--accent-hi); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8cb2ff" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4z"/><path d="M4 7.4 12 12l8-4.6M12 12v9.2" opacity=".55"/></svg>
    </div>
    <div class="brand">
      <h1>Xnova <span>HoloBridge</span></h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button id="lang-es" type="button" aria-pressed="true">ES</button>
      <button id="lang-en" type="button" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="t-convert">
      <h2 id="t-convert" data-i18n="convertTitle"></h2>
      <p class="sub" data-i18n="convertSub"></p>
      <label class="drop" id="drop" for="file">
        <input id="file" type="file" accept=".mcpack,.zip">
        <div class="big" data-i18n="dropBig"></div>
        <div class="hint" data-i18n="dropHint"></div>
        <div class="ext"><span class="chip">.mcpack</span><span class="chip">.zip</span></div>
      </label>
      <ul class="log" id="log" aria-live="polite"></ul>
      <div class="result" id="result">
        <div class="name" id="r-name"></div>
        <div class="subs" id="r-subs"></div>
        <button class="btn" id="r-dl" type="button" data-i18n="download"></button>

      </div>
    </section>

    <section class="panel" aria-labelledby="t-what">
      <h2 id="t-what" data-i18n="whatTitle"></h2>
      <p class="sub" data-i18n="whatSub"></p>
      <ol class="fix">
        <li><div class="n">01</div><div><strong data-i18n="f1t"></strong><span data-i18n="f1d"></span></div></li>
        <li><div class="n">02</div><div><strong data-i18n="f2t"></strong><span data-i18n="f2d"></span></div></li>
        <li><div class="n">03</div><div><strong data-i18n="f3t"></strong><span data-i18n="f3d"></span></div></li>
        <li><div class="n">04</div><div><strong data-i18n="f4t"></strong><span data-i18n="f4d"></span></div></li>
      </ol>
    </section>
  </div>

  <section class="panel" aria-labelledby="t-order">
    <h2 id="t-order" data-i18n="orderTitle"></h2>
    <p class="sub" data-i18n="orderSub"></p>
    <div class="stack">
      <div class="row hl"><span class="pos">1</span><span data-i18n="o1"></span><span class="tag" data-i18n="top"></span></div>
      <div class="row"><span class="pos">2</span><span><a href="https://www.curseforge.com/minecraft-bedrock/texture-packs/xnova-remastered">Xnova Remastered 1.3.1</a></span><span class="tag">CurseForge</span></div>
      <div class="row"><span class="pos">3</span><span data-i18n="o3"></span><span class="tag" data-i18n="bottom"></span></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="t-support">
    <h2 id="t-support" data-i18n="supTitle"></h2>
    <p class="sub" data-i18n="supSub"></p>
    <div class="support">
      <div class="card">
        <h3>Xnova Remastered</h3>
        <p data-i18n="cfDesc"></p>
        <a class="link-btn cf" href="https://www.curseforge.com/minecraft-bedrock/texture-packs/xnova-remastered" data-i18n="cfBtn"></a>
      </div>
      <div class="card">
        <h3 data-i18n="kofiTitle"></h3>
        <p data-i18n="kofiDesc"></p>
        <a class="link-btn kofi" href="https://ko-fi.com/xnovasm45328">&#9749; <span data-i18n="kofiBtn"></span></a>
      </div>
    </div>
  </section>

  <p class="foot" data-i18n-html="foot"></p>
</div>

<script type="module">
// Xnova HoloBridge — núcleo del parcheador (funciona en navegador y en Node 18+)
// Convierte un pack generado por HoloPrint en una versión compatible con Xnova Remastered,
// conservando los subpacks originales en modo Vanilla.

/* ============================== ZIP ============================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xffffffff;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
async function streamThrough(u8, stream) {
  const out = new Response(new Blob([u8]).stream().pipeThrough(stream));
  return new Uint8Array(await out.arrayBuffer());
}
const inflateRaw = (u8) => streamThrough(u8, new DecompressionStream("deflate-raw"));
const deflateRaw = (u8) => streamThrough(u8, new CompressionStream("deflate-raw"));

/** Lee un .zip/.mcpack -> Map(ruta -> Uint8Array) */
async function readZip(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("El archivo no es un .mcpack/.zip válido.");
  let count = dv.getUint16(eocd + 10, true);
  let cdOff = dv.getUint32(eocd + 16, true);
  const files = new Map();
  const dec = new TextDecoder();
  let p = cdOff;
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("Directorio del ZIP dañado.");
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (name.endsWith("/")) continue;
    const lnlen = dv.getUint16(lho + 26, true), lxlen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnlen + lxlen;
    const raw = u8.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw.slice();
    else if (method === 8) data = await inflateRaw(raw);
    else throw new Error(`Compresión ZIP no soportada (${method}) en ${name}`);
    files.set(name, data);
  }
  return stripCommonRoot(files);
}
// Algunos packs vienen dentro de una carpeta: la quitamos si manifest.json no está en la raíz
function stripCommonRoot(files) {
  if (files.has("manifest.json")) return files;
  const m = [...files.keys()].find((k) => /^[^/]+\/manifest\.json$/.test(k));
  if (!m) return files;
  const pre = m.slice(0, m.indexOf("/") + 1);
  const out = new Map();
  for (const [k, v] of files) if (k.startsWith(pre)) out.set(k.slice(pre.length), v);
  return out;
}

/** Escribe Map(ruta -> Uint8Array) a un ZIP (Uint8Array) */
async function writeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let off = 0;
  for (const [name, data] of files) {
    const nameB = enc.encode(name);
    const crc = crc32(data);
    const comp = await deflateRaw(data);
    const useDeflate = comp.length < data.length;
    const body = useDeflate ? comp : data;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(8, useDeflate ? 8 : 0, true); h.setUint32(14, crc, true);
    h.setUint32(18, body.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nameB.length, true);
    chunks.push(new Uint8Array(h.buffer), nameB, body);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(10, useDeflate ? 8 : 0, true); c.setUint32(16, crc, true); c.setUint32(20, body.length, true);
    c.setUint32(24, data.length, true); c.setUint16(28, nameB.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nameB);
    off += 30 + nameB.length + body.length;
  }
  const cdSize = central.reduce((s, a) => s + a.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.size, true); e.setUint16(10, files.size, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  const all = [...chunks, ...central, new Uint8Array(e.buffer)];
  const out = new Uint8Array(all.reduce((s, a) => s + a.length, 0));
  let q = 0;
  for (const a of all) { out.set(a, q); q += a.length; }
  return out;
}

/* ============================== JSON ============================== */
const td = new TextDecoder(), te = new TextEncoder();
/** JSON con comentarios // y /* *\/ y comas finales (como los JSON de Bedrock) */
function parseJsonLoose(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  let out = "", i = 0, inStr = false;
  while (i < text.length) {
    const ch = text[i];
    if (inStr) {
      out += ch;
      if (ch === "\\") { out += text[i + 1] ?? ""; i += 2; continue; }
      if (ch === '"') inStr = false;
      i++; continue;
    }
    if (ch === '"') { inStr = true; out += ch; i++; continue; }
    if (ch === "/" && text[i + 1] === "/") { while (i < text.length && text[i] !== "\n") i++; continue; }
    if (ch === "/" && text[i + 1] === "*") { const j = text.indexOf("*/", i + 2); i = j < 0 ? text.length : j + 2; continue; }
    out += ch; i++;
  }
  return JSON.parse(out.replace(/,(\s*[}\]])/g, "$1"));
}
const readJson = (files, path) => (files.has(path) ? parseJsonLoose(td.decode(files.get(path))) : null);
const toBytes = (obj) => te.encode(JSON.stringify(obj));

/* ===================== Remapeo de los botones de HoloPrint =====================
 * El HUD de Xnova usa un soporte invisible que sostiene el objeto seleccionado de la hotbar.
 * HoloPrint detecta sus botones táctiles con un soporte invisible que sostiene piedra, tierra, etc.
 * -> Con Xnova, tener piedra seleccionada "pulsaría" botones. Cambiamos los botones a bloques
 *    técnicos que nunca pueden estar en la hotbar (no se pueden sostener). */
const UI_REMAP = [
  // [nombres originales de HoloPrint que identifican la acción, nombres nuevos, variable UI, id numérico]
  [["minecraft:stone", "minecraft:grass_block"], ["minecraft:wheat_plant"], "toggle_rendering_item", 59],
  [["minecraft:dirt"], ["minecraft:fire"], "increase_opacity_item", 51],
  [["minecraft:cobblestone"], ["minecraft:redstone_wire"], "decrease_opacity_item", 55],
  [["minecraft:oak_planks", "minecraft:oak_sapling"], ["minecraft:lit_furnace"], "toggle_tint_item", 62],
  [["minecraft:bedrock"], ["minecraft:standing_sign"], "increase_layer_item", 63],
  [["minecraft:flowing_water"], ["minecraft:flowing_water"], "decrease_layer_item", 8],
  [["minecraft:water"], ["minecraft:water"], "change_layer_mode_item", 9],
  [["minecraft:lava"], ["minecraft:lava"], "toggle_validating_item", 11],
  [["minecraft:gravel"], ["minecraft:wall_sign"], "increase_x_item", 68],
  [["minecraft:gold_ore"], ["minecraft:lit_redstone_ore"], "decrease_x_item", 74],
  [["minecraft:iron_ore"], ["minecraft:unlit_redstone_torch"], "increase_y_item", 75],
  [["minecraft:coal_ore"], ["minecraft:portal"], "decrease_y_item", 90],
  [["minecraft:oak_log"], ["minecraft:unpowered_repeater"], "increase_z_item", 93],
  [["minecraft:oak_leaves"], ["minecraft:powered_repeater"], "decrease_z_item", 94],
  [["minecraft:sponge"], ["minecraft:pumpkin_stem"], "rotate_clockwise_item", 104],
  [["minecraft:glass"], ["minecraft:melon_stem"], "rotate_anticlockwise_item", 105],
  [["minecraft:lapis_ore"], ["minecraft:nether_wart_plant"], "next_structure_item", 115],
  [["minecraft:lapis_block"], ["minecraft:end_portal"], "previous_structure_item", 119],
  [["minecraft:dispenser", "minecraft:sandstone"], ["minecraft:flowing_lava"], "backup_hologram_item", 10],
];
const OFFHAND_CHECK = /q\.is_item_name_any\(\s*'slot\.weapon\.offhand'\s*,\s*((?:'[a-z0-9_:.]+'\s*,?\s*)+)\)(\s*\?\s*\{\s*t\.ui_action\s*=)/gi;

/** Reescribe las comprobaciones de botones UI dentro de un script Molang. Devuelve [script, nºcambios] */
function remapUiScript(script) {
  let n = 0;
  const outScript = script.replace(OFFHAND_CHECK, (full, list, tail) => {
    const names = [...list.matchAll(/'([^']+)'/g)].map((m) => m[1].toLowerCase());
    const rule = UI_REMAP.find(([orig]) => orig.some((o) => names.includes(o)));
    if (!rule) return full;
    n++;
    return `q.is_item_name_any('slot.weapon.offhand',${rule[1].map((x) => `'${x}'`).join(",")})${tail}`;
  });
  return [outScript, n];
}
function remapScriptsInDescription(desc) {
  let total = 0;
  const sc = desc.scripts || {};
  for (const key of ["initialize", "pre_animation"]) {
    if (!Array.isArray(sc[key])) continue;
    sc[key] = sc[key].map((s) => {
      if (typeof s !== "string") return s;
      const [r, n] = remapUiScript(s);
      total += n;
      return r;
    });
  }
  return total;
}
function remapGlobalVariables(gv) {
  const out = { ...gv };
  for (const [, , varName, id] of UI_REMAP) {
    const k = `$holoprint:${varName}`;
    if (k in out) out[k] = id;
  }
  return out;
}

/* ===================== Fusión del soporte (attachable) =====================
 * En Bedrock, un attachable con identificador "minecraft:armor_stand" reemplaza a la entidad
 * del soporte. Xnova tiene uno (para el soporte 3D en la mano), así que el holograma desaparece.
 * Solución: un único attachable que hace las dos cosas:
 *   - en la mano (q.is_attached): lo de Xnova
 *   - en el mundo (!q.is_attached): la entidad de HoloPrint con el holograma */
const NOT_ATTACHED = "!q.is_attached";
const guard = (cond) => (cond === undefined || cond === null || cond === "" ? NOT_ATTACHED : `(${cond}) && ${NOT_ATTACHED}`);
const entryKey = (e) => (typeof e === "string" ? e : Object.keys(e)[0]);
const entryCond = (e) => (typeof e === "string" ? undefined : Object.values(e)[0]);

function mergeArmorStand(xnovaAttachable, holoprintEntity) {
  const X = structuredClone(xnovaAttachable["minecraft:attachable"].description);
  const H = structuredClone(holoprintEntity["minecraft:client_entity"].description);
  const M = { ...X };
  for (const k of ["materials", "textures", "geometry", "animations", "particle_effects", "sound_effects"]) {
    if (H[k] || X[k]) M[k] = { ...(H[k] || {}), ...(X[k] || {}) }; // Xnova manda en "default" (su textura/modelo)
  }
  for (const k of Object.keys(H)) if (!(k in M) && k !== "identifier" && k !== "scripts" && k !== "render_controllers" && k !== "spawn_egg") M[k] = H[k];

  const xs = X.scripts || {}, hs = H.scripts || {};
  const S = { ...xs };
  // initialize: lo de Xnova + lo nuevo de HoloPrint
  S.initialize = [...(xs.initialize || [])];
  for (const line of hs.initialize || []) if (!S.initialize.includes(line)) S.initialize.push(line);
  // pre_animation de HoloPrint: usa "return", así que no se puede envolver; se corta al inicio si está en la mano
  S.pre_animation = [...(xs.pre_animation || []), ...(hs.pre_animation || []).map((s) => `q.is_attached?{return;};${s}`)];
  // animate: las de HoloPrint solo en el mundo
  const animate = [...(xs.animate || [])];
  const have = new Set(animate.map(entryKey));
  for (const e of hs.animate || []) {
    const k = entryKey(e);
    if (have.has(k)) continue;
    animate.push({ [k]: guard(entryCond(e)) });
    have.add(k);
  }
  S.animate = animate;
  for (const k of Object.keys(hs)) if (!["initialize", "pre_animation", "animate"].includes(k) && !(k in S)) S[k] = hs[k];
  M.scripts = S;

  // render controllers
  const rcs = [...(X.render_controllers || [])];
  const haveRc = new Set(rcs.map(entryKey));
  for (const e of H.render_controllers || []) {
    const k = entryKey(e);
    if (haveRc.has(k)) continue;
    rcs.push({ [k]: guard(entryCond(e)) });
    haveRc.add(k);
  }
  M.render_controllers = rcs;
  M.enable_attachables = true;
  M.identifier = "minecraft:armor_stand";

  const remapped = remapScriptsInDescription(M);
  return {
    json: { format_version: xnovaAttachable.format_version || "1.10.0", "minecraft:attachable": { description: M } },
    remapped,
  };
}

/* ===================== Controles del jugador (render controller) =====================
 * HoloPrint mete su código de controles delante de textures[0] del render controller del jugador.
 * Lo extraemos y lo aplicamos sobre el de Xnova, para no perder ni los controles ni las funciones de Xnova. */
function splitHoloprintPatch(texture0) {
  const idx = texture0.lastIndexOf("return ");
  if (idx < 0) return null;
  return texture0.slice(0, idx);
}
function patchPlayerRenderControllers(xnovaRc, holoprintRc) {
  const out = { format_version: xnovaRc.format_version, render_controllers: {} };
  let patched = 0;
  for (const [id, xc] of Object.entries(xnovaRc.render_controllers)) {
    const hc = holoprintRc?.render_controllers?.[id];
    if (!hc) continue;
    const patch = splitHoloprintPatch(String(hc.textures?.[0] ?? ""));
    if (!patch) continue;
    const orig = String(xc.textures[0]);
    const t0 = patch + (orig.trim().endsWith(";") ? orig : `return ${orig};`);
    out.render_controllers[id] = { ...structuredClone(xc), textures: [t0, ...xc.textures.slice(1)] };
    patched++;
  }
  return { json: out, patched };
}

/* ============================== Proceso principal ============================== */
async function convertHoloprintPack(inputBuffer, XNOVA, log = () => {}) {
  const files = await readZip(inputBuffer);
  const manifest = readJson(files, "manifest.json");
  if (!manifest) throw new Error("No se encontró manifest.json en el pack.");
  const isHolo = !!manifest.metadata?.generated_with?.holoprint ||
    [...files.keys()].some((k) => /^subpacks\/[^/]+\/entity\/armor_stand\.entity\.json$/.test(k));
  if (!isHolo) throw new Error("Este pack no parece generado por HoloPrint.");
  if ((manifest.metadata?.generated_with?.["xnova_holobridge"])) throw new Error("Este pack ya fue convertido con Xnova HoloBridge.");

  const subpacks = Array.isArray(manifest.subpacks) && manifest.subpacks.length ? manifest.subpacks : [{ folder_name: null, name: "Default" }];
  log(`HoloPrint detectado · ${subpacks.length} subpack(s)`);

  const out = new Map(files);
  const holoRc = readJson(files, "render_controllers/player.render_controllers.json");
  const xnovaRc = holoRc ? patchPlayerRenderControllers(XNOVA.playerRenderControllers, holoRc) : null;
  if (xnovaRc) log(`Controles del jugador fusionados con Xnova (${xnovaRc.patched} render controllers)`);
  else log("Este pack no usa controles con objetos: no hay que fusionar render controllers");

  const gv = readJson(files, "ui/_global_variables.json");
  const newSubpacks = [];
  const stats = { attachables: 0, remapped: 0 };

  for (const sp of subpacks) {
    const src = sp.folder_name ? `subpacks/${sp.folder_name}/` : "";
    const base = sp.folder_name || "root";
    const vanillaFolder = `${base}__vanilla`, xnovaFolder = `${base}__xnova`;
    // Vanilla: copia exacta del subpack original
    for (const [k, v] of files) if (src && k.startsWith(src)) out.set(`subpacks/${vanillaFolder}/${k.slice(src.length)}`, v);
    // Xnova: copia + attachable fusionado + controles + botones remapeados
    for (const [k, v] of files) if (src && k.startsWith(src)) out.set(`subpacks/${xnovaFolder}/${k.slice(src.length)}`, v);

    const entPath = `${src}entity/armor_stand.entity.json`;
    const ent = readJson(files, entPath);
    if (ent) {
      const merged = mergeArmorStand(XNOVA.armorStandAttachable, ent);
      out.set(`subpacks/${xnovaFolder}/attachables/xnova_holobridge_armor_stand.json`, toBytes(merged.json));
      const entCopy = structuredClone(ent);
      stats.remapped += merged.remapped + remapScriptsInDescription(entCopy["minecraft:client_entity"].description);
      out.set(`subpacks/${xnovaFolder}/entity/armor_stand.entity.json`, toBytes(entCopy));
      stats.attachables++;
    }
    for (const other of ["leash_knot"]) {
      const p = `${src}entity/${other}.entity.json`;
      const e = readJson(files, p);
      if (e) { const c = structuredClone(e); stats.remapped += remapScriptsInDescription(c["minecraft:client_entity"].description); out.set(`subpacks/${xnovaFolder}/entity/${other}.entity.json`, toBytes(c)); }
    }
    if (xnovaRc) out.set(`subpacks/${xnovaFolder}/render_controllers/player.render_controllers.json`, toBytes(xnovaRc.json));
    if (gv) out.set(`subpacks/${xnovaFolder}/ui/_global_variables.json`, toBytes(remapGlobalVariables(gv)));

    const label = String(sp.name ?? base).replace(/\s*\/\/.*$/, "");
    newSubpacks.push({ v: { ...sp, folder_name: vanillaFolder, name: `${label} · Vanilla` }, x: { ...sp, folder_name: xnovaFolder, name: `${label} · Xnova` } });
  }
  // quitar los subpacks originales (ya copiados)
  for (const sp of subpacks) if (sp.folder_name) for (const k of [...out.keys()]) if (k.startsWith(`subpacks/${sp.folder_name}/`)) out.delete(k);

  // Orden: primero los Vanilla y al final los Xnova (HoloPrint deja su "Default" al final; se respeta)
  const m = structuredClone(manifest);
  m.subpacks = [...newSubpacks.map((s) => s.v), ...newSubpacks.map((s) => s.x)];
  const uuid = () => (globalThis.crypto?.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (Math.random() * 16) >> (c / 4)).toString(16)));
  m.header.uuid = uuid();
  if (m.modules?.[0]) m.modules[0].uuid = uuid();
  const nm = String(m.header.name ?? "HoloPrint");
  m.header.name = /pack\.name/.test(nm) ? nm : `${nm} §b[Xnova]`;
  m.metadata = m.metadata || {};
  m.metadata.generated_with = { ...(m.metadata.generated_with || {}), xnova_holobridge: ["1.0.0"] };
  out.set("manifest.json", toBytes(m));

  log(`Soporte fusionado en ${stats.attachables} subpack(s) · ${stats.remapped} botones de la interfaz remapeados`);
  const zip = await writeZip(out);
  return { zip, stats: { ...stats, subpacks: m.subpacks.map((s) => s.name), files: out.size } };
}

    noteZip: "<b>Importante:</b> aquí la descarga sale como .zip. Cambia la extensión a <b>.mcpack</b> y ábrelo para importarlo.",

    saved: "Descarga iniciada",
    declined: "Descarga cancelada",

  },
  en: {
    tagline: "HoloPrint holograms working with Xnova Remastered",
    convertTitle: "Convert pack",
    convertSub: "Drop the .mcpack HoloPrint gave you. Everything runs on your device: the file is never uploaded.",
    dropBig: "Tap or drop your HoloPrint pack",
    dropHint: "Works with any build, of any size",
    download: "Download compatible pack",
    whatTitle: "What it fixes",
    whatSub: "Xnova and HoloPrint change the same game files. This merges them into one.",
    f1t: "The hologram shows up again",
    f1d: "Xnova renders the armor stand in 3D in your hand, which replaced the hologram entity. Now the same armor stand does both.",

    orderTitle: "Pack order",

    o1: "Your converted HoloPrint pack [Xnova]",
    o3: "Other packs",
    top: "top", bottom: "bottom",
    foot: "Made by <b>Xnova MC</b> · HoloPrint by <a href=\"https://github.com/SuperLlama88888/holoprint\">SuperLlama88888</a> (CC BY-NC-SA 4.0)",
    supTitle: "Support the project",

    cfDesc: "The texture pack this tool is made for: 3D models, first-person animations and in-game settings.",

    kofiDesc: "Donations help keep HoloBridge and the Xnova packs up to date. Completely optional.",
    kofiBtn: "Support on Ko-fi",
    reading: "Reading {name}…",
    ready: "Done: {n} subpacks · {f} files",
    noteZip: "<b>Important:</b> here the download comes out as .zip. Rename it to <b>.mcpack</b> and open it to import.",
    noteMcpack: "Open it to import. In game pick the <b>Default · Xnova</b> subpack (selected by default) or a <b>· Vanilla</b> one if you play without Xnova.",
    defaultTip: "★ = enabled by default",

    declined: "Download cancelled",

const MSG_EN = {
  "HoloPrint detectado": "HoloPrint detected",
  "Controles del jugador fusionados con Xnova": "Player controls merged with Xnova",
  "Este pack no usa controles con objetos": "This pack doesn't use item controls",
  "Soporte fusionado en": "Armor stand merged in",
};
let lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
try { const s = localStorage.getItem("xhb-lang"); if (s === "es" || s === "en") lang = s; } catch {}
const t = (k, vars = {}) => T[lang][k].replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "");
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  document.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = t(el.dataset.i18nHtml)));
  document.getElementById("lang-es").setAttribute("aria-pressed", lang === "es");
  document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
  if (last) renderResult();
}
for (const l of ["es", "en"]) document.getElementById(`lang-${l}`).addEventListener("click", () => { lang = l; try { localStorage.setItem("xhb-lang", l); } catch {} applyLang(); });

// Descargas: dentro de Claude se usa la capacidad "downloads" (solo admite .zip); fuera, descarga normal .mcpack
let downloads = null;
const inClaude = typeof window.claude?.use === "function";
if (inClaude) window.claude.use("downloads").then((d) => { downloads = d; if (last) renderResult(); }).catch(() => {});

const logEl = document.getElementById("log");
const resultEl = document.getElementById("result");
let last = null;
function log(text, cls = "") {
  const li = document.createElement("li");
  if (cls) li.className = cls;
  let txt = text;
  if (lang === "en") for (const [es, en] of Object.entries(MSG_EN)) txt = txt.replace(es, en);
  li.textContent = txt;
  logEl.append(li);
}
function baseName(n) { return n.replace(/\.(mcpack|zip)$/i, ""); }
function renderResult() {
  if (!last) return;
  document.getElementById("r-name").textContent = `${last.base} [Xnova]`;
  const subs = document.getElementById("r-subs");
  subs.innerHTML = "";
  last.stats.subpacks.forEach((s, i, a) => {
    const el = document.createElement("span");
    el.className = `sp ${/Xnova$/.test(s) ? "x" : "v"}${i === a.length - 1 ? " def" : ""}`;
    el.textContent = s;
    subs.append(el);
  });
  const tip = document.createElement("span");
  tip.className = "chip"; tip.textContent = t("defaultTip");
  subs.append(tip);
  document.getElementById("r-note").innerHTML = inClaude ? t("noteZip") : t("noteMcpack");
  resultEl.classList.add("show");
}
async function handle(file) {
  if (!file) return;
  logEl.innerHTML = ""; resultEl.classList.remove("show"); last = null;
  log(t("reading", { name: file.name }));
  try {
    const buf = await file.arrayBuffer();
    const res = await convertHoloprintPack(buf, XNOVA, (m) => log(m));
    last = { base: baseName(file.name), zip: res.zip, stats: res.stats };
    log(t("ready", { n: res.stats.subpacks.length, f: res.stats.files }), "ok");
    renderResult();
  } catch (e) {
    log(e?.message || String(e), "err");
  }
}
document.getElementById("file").addEventListener("change", (e) => handle(e.target.files[0]));
const drop = document.getElementById("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove("over")));
drop.addEventListener("drop", (e) => { e.preventDefault(); handle(e.dataTransfer.files[0]); });

document.getElementById("r-dl").addEventListener("click", async () => {
  if (!last) return;
  const blob = new Blob([last.zip], { type: "application/zip" });
  if (inClaude) {
    if (!downloads) { log(t("dlFail", { msg: "downloads" }), "err"); return; }
    try { await downloads.save({ filename: `${last.base} [Xnova].zip`, data: blob }); log(t("saved"), "ok"); }
    catch (e) { log(e?.code === "declined" ? t("declined") : t("dlFail", { msg: e?.message || e?.code || e }), e?.code === "declined" ? "" : "err"); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${last.base} [Xnova].mcpack`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  log(t("saved"), "ok");
});
applyLang();
</script>
